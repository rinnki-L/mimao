name: mimao
description: "mimao — 一个聚合番剧、漫画、小说与音乐的本地媒体应用（Flutter + Material 3）"
publish_to: "none"
version: 0.1.0+1

environment:
  # Kazumi v2.4.4 基线：Flutter 3.50 / Dart >=3.10（docs/architecture.md §8）
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # M1 · 桌面窗口 / 托盘（shell/window/window.dart 里运行时平台判断，Android 空操作）
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # 壳级状态（demo 02 方向；拍板项 2 临时决定：接受 MobX）
  mobx: ^2.3.0
  flutter_mobx: ^2.3.0

  # 统一书架（demo 04 方向；拍板项 1 临时决定：drift）
  drift: ^2.22.0
  drift_flutter: ^0.2.0

  # A 线 · 番剧规则引擎：dio 抓网页（UA/Cookie），xpath_selector 解释
  # KazumiRules（只支持 // 开头选择器；说明见 lib/anime/engine/README.md）
  dio: ^5.11.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1

  # 音乐播放器内核：media_kit（libmpv 后端）+ 各平台预编译 native 库
  # （media_kit_libs_video 内含 libmpv/音频解码，纯音频播放复用它）
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7

  # 音乐长尾 UI：本地选图（头像/歌单封面/导入截图）与麦克风采集（听歌识曲）。
  # 两者都支持 Windows + Android；record 7.x 在 Windows 走 MediaFoundation，
  # 不需要额外二进制。只在用户主动操作时触发，测试注入 fake 不走插件。
  file_picker: ^13.4.0
  record: ^7.2.0

  # 漫画 A′ 线 · 源引擎：flutter_qjs(CyrilPeng fork) 跑社区 Venera JS 源；
  # cookie_jar 管 Cookie；html 解析源脚本里的 HtmlDocument/DOM。
  # flutter_qjs 走 git 固定到上游对齐的 commit；首次编译会拉 native QuickJS。
  flutter_qjs:
    git:
      url: https://github.com/CyrilPeng/flutter_qjs
      ref: f5a1f20d08c33b0a6b3e38eda2a7b27705420620
  cookie_jar: ^4.0.9
  # 漫画 C 线 · Cloudflare 挑战通行证：内嵌 WebView 让用户过一次挑战，
  # 取 cf_clearance + WebView UA（Windows 走 WebView2，Android 走系统 WebView）。
  # 6.2 beta 3：Android 端已改用 proguard-android-optimize（AGP 9 兼容）。
  flutter_inappwebview: 6.2.0-beta.3
  html: ^0.15.7
  crypto: ^3.0.8

  # M4 骨架 · 音乐 API 客户端：酷狗概念版信封协议需要 AES-128-CBC（PKCS7）与
  # RSA PKCS#1 v1.5（点对点翻译 EchoMusicNext crates/echo-api util/crypto.rs；
  # 纯 Dart 实现，无平台插件，CI 安全）。MD5 走上面的 crypto 包。
  pointycastle: ^3.9.0

  # D 线 · 主题跟随系统强调色：system_theme 读 Windows/Android 系统 accent
  # 并监听变化（main.dart 里 load + onChange）；CI/Linux 测试不触发插件。
  # 用 3.3.0：2.3.1 的 android/build.gradle 仍在用已移除的 jcenter()，
  # 会让 build-android（AGP 9 / Gradle 9）构建失败；3.x API 与 2.3.1 兼容。
  system_theme: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  mobx_codegen: ^2.1.0
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mimao.png

# 一键从 assets/mimao.png 生成 Windows ICO + Android 各密度图标
# （ENV-SETUP-LOCAL.md 的 M1 待办；单一 PNG 作 source-of-truth，不手维护 ICO）
flutter_launcher_icons:
  image_path: "assets/mimao.png"
  android: true
  windows:
    generate: true
