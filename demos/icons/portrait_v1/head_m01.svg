    <path d="M254 352 Q 257 355 260 352" fill="none" stroke="#F2C7B7" stroke-width="4" stroke-linecap="round"/>
    <path d="M246 377 Q256 378 266 377" fill="none" stroke="#B96363" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 腮红 -->
