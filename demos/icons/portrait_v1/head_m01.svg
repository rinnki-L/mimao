    <path d="M180 268 Q 208 274 232 272" fill="none" stroke="#232840" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
         <path d="M280 272 Q 304 274 332 268" fill="none" stroke="#232840" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
