<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入口页版式提案 · 四版 · MD3</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   这是「选型用」的静态交互 mock，不是最终 Flutter 实现。
   目标：验证入口结构（四扇门 → 进去后只剩这一层）+ MD3 的视觉语法。
   一切自包含：无外部字体、无外部图片、无 JS 依赖。
   ═══════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
button{font:inherit;color:inherit}
body{
  --font:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;
  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-emph:cubic-bezier(.05,.7,.1,1);
  font-family:var(--font);
  background:#151318;
  color:#e9e4ee;
  -webkit-font-smoothing:antialiased;
}

/* ── MD3 色板：同一套角色，三种种子色 ───────────────────────────── */
body[data-seed="violet"]{
  --primary:#6750A4; --on-primary:#FFFFFF;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary:#625B71; --on-secondary:#FFFFFF;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary:#7D5260; --on-tertiary:#FFFFFF;
  --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
  --quaternary:#00696D; --on-quaternary:#FFFFFF;
  --quaternary-container:#9CF0F5; --on-quaternary-container:#002022;
  --surface:#FEF7FF; --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F7F2FA; --surface-container:#F3EDF7;
  --surface-container-high:#ECE6F0; --surface-container-highest:#E6E0E9;
  --on-surface:#1D1B20; --on-surface-variant:#49454F;
  --surface-variant:#E7E0EC; --outline:#79747E; --outline-variant:#CAC4D0;
  --inverse-surface:#322F35; --inverse-on-surface:#F5EFF7;
}
body[data-seed="green"]{
  --primary:#386A20; --on-primary:#FFFFFF;
  --primary-container:#B9F397; --on-primary-container:#042100;
  --secondary:#55624C; --on-secondary:#FFFFFF;
  --secondary-container:#D9E7CB; --on-secondary-container:#131F0D;
  --tertiary:#386667; --on-tertiary:#FFFFFF;
  --tertiary-container:#BBEBEC; --on-tertiary-container:#002020;
  --quaternary:#7A5900; --on-quaternary:#FFFFFF;
  --quaternary-container:#FFDF9E; --on-quaternary-container:#261900;
  --surface:#F8FAF2; --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F2F5EC; --surface-container:#ECEFE7;
  --surface-container-high:#E6E9E1; --surface-container-highest:#E1E4DB;
  --on-surface:#191D17; --on-surface-variant:#43483E;
  --surface-variant:#DFE4D7; --outline:#73796D; --outline-variant:#C3C8BB;
  --inverse-surface:#2E322B; --inverse-on-surface:#EFF1EA;
}
body[data-seed="ochre"]{
  --primary:#8B5000; --on-primary:#FFFFFF;
  --primary-container:#FFDCBE; --on-primary-container:#2D1600;
  --secondary:#725B3E; --on-secondary:#FFFFFF;
  --secondary-container:#FEDEBA; --on-secondary-container:#281806;
  --tertiary:#5C6238; --on-tertiary:#FFFFFF;
  --tertiary-container:#E0E8B9; --on-tertiary-container:#191E00;
  --quaternary:#3F6374; --on-quaternary:#FFFFFF;
  --quaternary-container:#C2E8FA; --on-quaternary-container:#001F28;
  --surface:#FFF8F3; --surface-container-lowest:#FFFFFF;
  --surface-container-low:#FBF2EA; --surface-container:#F5EBE2;
  --surface-container-high:#EFE5DC; --surface-container-highest:#E9DFD6;
  --on-surface:#211A15; --on-surface-variant:#51443A;
  --surface-variant:#EDE0D4; --outline:#837469; --outline-variant:#D5C3B5;
  --inverse-surface:#362F29; --inverse-on-surface:#FBEEE4;
}
body{
  --cat-anime:var(--primary); --cat-anime-c:var(--primary-container); --cat-anime-on:var(--on-primary-container);
  --cat-comic:var(--tertiary); --cat-comic-c:var(--tertiary-container); --cat-comic-on:var(--on-tertiary-container);
  --cat-novel:var(--secondary); --cat-novel-c:var(--secondary-container); --cat-novel-on:var(--on-secondary-container);
  --cat-music:var(--quaternary); --cat-music-c:var(--quaternary-container); --cat-music-on:var(--on-quaternary-container);
}

/* ── 演示控制台（不属于 App UI） ─────────────────────────────────── */
.studio{max-width:1420px;margin:0 auto;padding:26px 26px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap}
.studio h1{font-size:21px;font-weight:600;margin:0 0 5px;letter-spacing:.01em}
.studio p{margin:0;font-size:12.5px;line-height:1.6;color:#a69fae}
.studio-controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.control-group{display:flex;flex-direction:column;gap:7px}
.control-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8d8696;font-weight:600}
.seg{display:inline-flex;background:#29252f;border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.seg button{border:0;background:transparent;color:#c9c2d1;font-size:12.5px;padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .18s var(--ease-standard),color .18s}
.seg button:hover{background:rgba(255,255,255,.07)}
.seg button[aria-selected="true"]{background:#EADDFF;color:#21005D;font-weight:600}
.swatches{display:flex;gap:9px;align-items:center;height:44px}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.swatch.on{border-color:#f4eefc;box-shadow:0 0 0 3px rgba(234,221,255,.18)}
.swatch span{position:absolute;inset:6px;border-radius:50%;background:rgba(255,255,255,.55)}

/* ── 桌面窗口外壳 ─────────────────────────────────────────────────── */
.stage{max-width:1420px;margin:0 auto;padding:10px 26px 0}
.window{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.04) inset;border:1px solid rgba(255,255,255,.09);container-type:inline-size}
.window.phone{width:390px;margin:0 auto;border-radius:34px;border-color:rgba(255,255,255,.18)}
.window.phone .titlebar{border-radius:34px 34px 0 0}
.window.phone .app{height:760px}
.titlebar{height:38px;background:#DED6E0;display:flex;align-items:center;gap:10px;padding:0 12px;color:#4B4550;font-size:12px;border-bottom:1px solid rgba(0,0,0,.07)}
.win-mark{width:16px;height:16px;border-radius:5px;background:linear-gradient(140deg,#6750A4,#B69DF8);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.win-title{font-weight:600;letter-spacing:.01em}
.win-sub{color:#7a7480}
.win-controls{margin-left:auto;display:flex;gap:2px}
.win-controls span{width:34px;height:25px;display:grid;place-items:center;border-radius:6px;font-size:12px;color:#5E5864}
.win-controls span:hover{background:rgba(0,0,0,.07)}
.phone-time,.phone-batt{display:none}
.window.phone .titlebar{height:32px;background:var(--surface);border-bottom:0;position:relative;justify-content:center;padding:0 16px}
.window.phone .win-mark,.window.phone .win-title,.window.phone .win-sub,.window.phone .win-controls{display:none}
.window.phone .phone-time{display:block;position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--on-surface)}
.window.phone .phone-batt{display:block;position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--on-surface-variant);letter-spacing:1px}
.window.phone .titlebar::after{content:"";position:absolute;left:50%;top:8px;width:58px;height:16px;margin-left:-29px;border-radius:999px;background:var(--inverse-surface);opacity:.9}
.app{height:812px;overflow:hidden;position:relative;background:var(--surface);color:var(--on-surface);isolation:isolate}

/* ── 通用零件 ─────────────────────────────────────────────────────── */
.screen{height:100%;overflow:auto;padding:30px 32px 34px;animation:screenIn .32s var(--ease-emph) both}
.screen.fill{display:flex;flex-direction:column;min-height:0}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.icon{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.icon.sm{width:20px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;transition:background .18s var(--ease-standard),color .18s}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent);color:var(--on-surface)}
.icon-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:600;margin:0 0 8px}
.display-title{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.015em;margin:0}
.topbar-large{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.topbar-actions{display:flex;align-items:center;gap:4px;padding-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center;font-size:13px;font-weight:700;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--outline-variant);font-size:11.5px;color:var(--on-surface-variant);white-space:nowrap}
.chip.tonal{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);font-weight:600}
.meta{font-size:12px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--on-surface-variant);opacity:.65;flex:none;transition:transform .2s var(--ease-standard),opacity .2s}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.2;pointer-events:none;transform:scale(0);animation:rip .55s var(--ease-standard) forwards}
@keyframes rip{to{transform:scale(2.8);opacity:0}}

/* ── 四类预览（纯 CSS 造物，不引用图片） ──────────────────────────── */
.pv{height:100%;position:relative;overflow:hidden;border-radius:inherit}
.poster{flex:1;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(155deg,var(--cat-c),color-mix(in srgb,var(--cat) 62%,var(--surface)));box-shadow:0 3px 10px rgba(0,0,0,.14)}
.poster>i,.cover>i,.album>i{position:absolute;inset:0;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.34),transparent 46%),linear-gradient(200deg,transparent 55%,rgba(0,0,0,.18))}
.pv-anime{display:flex;align-items:flex-end;gap:7px;padding:8px 10px}
.pv-anime .p1{height:70%}.pv-anime .p2{height:94%}.pv-anime .p3{height:56%;opacity:.9}
.ep-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.42);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;backdrop-filter:blur(4px)}
.ep-progress{position:absolute;left:6px;right:6px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.34);overflow:hidden}
.ep-progress b{display:block;height:100%;background:#fff;border-radius:2px}
.pv-comic{display:flex;align-items:center;justify-content:center;padding:7px}
.pv-comic .cover{width:43%;height:84%;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--cat-c),color-mix(in srgb,var(--cat) 55%,var(--surface)));box-shadow:0 4px 12px rgba(0,0,0,.18)}
.pv-comic .c1{transform:rotate(-7deg) translateX(9px);height:78%;opacity:.94}
.pv-comic .c2{transform:rotate(5deg) translateX(-7px);z-index:1}
.comic-note{position:absolute;right:9px;bottom:8px;background:var(--surface);color:var(--on-surface);font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pv-novel{padding:7px 10px}
.page{height:100%;border-radius:7px;background:var(--surface-container-lowest);padding:9px 11px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.09);overflow:hidden}
.page::after{content:"";position:absolute;right:0;top:0;border-width:0 12px 12px 0;border-style:solid;border-color:transparent var(--cat-c) transparent transparent}
.pline{height:3px;border-radius:2px;background:color-mix(in srgb,var(--on-surface) 17%,transparent);margin:0 0 6px}
.w92{width:92%}.w78{width:78%}.w86{width:86%}.w64{width:64%}
.quote{font-size:9.5px;line-height:1.45;color:var(--on-surface-variant);margin-top:7px;border-left:2px solid var(--cat);padding-left:6px}
.pv-music{display:flex;align-items:center;gap:10px;padding:7px 10px}
.album{width:70px;height:70px;flex:none;border-radius:12px;background:linear-gradient(140deg,var(--cat),color-mix(in srgb,var(--cat) 40%,#000 20%));position:relative;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.vinyl{width:32px;height:32px;border-radius:50%;background:repeating-radial-gradient(circle,#000 0 2px,#2a2a2a 2px 3px);box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--cat-c);transform:translate(-50%,-50%)}
.tracks{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.track{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--on-surface-variant);min-width:0}
.tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tdur{font-variant-numeric:tabular-nums;opacity:.7;font-size:9px}
.eq{display:flex;align-items:flex-end;gap:2px;height:9px;flex:none}
.eq i{width:2px;border-radius:1px;background:var(--cat);animation:eq 1.1s var(--ease-standard) infinite alternate}
.eq i:nth-child(1){height:4px;animation-delay:-.2s}
.eq i:nth-child(2){height:9px;animation-delay:-.5s}
.eq i:nth-child(3){height:6px;animation-delay:-.8s}
.eq.dim i{background:color-mix(in srgb,var(--cat) 35%,var(--surface));animation:none;height:4px}
@keyframes eq{from{height:3px}to{height:9px}}
.pv.lg .album{width:118px;height:118px;border-radius:18px}
.pv.lg .vinyl{width:52px;height:52px}
.pv.lg .vinyl::after{width:12px;height:12px}
.pv.lg .track{font-size:12px;gap:9px}
.pv.lg .tracks{gap:10px}
.pv.lg .quote{font-size:12px}
.pv.lg .pline{height:4px;margin-bottom:8px}
.pv.lg .poster{border-radius:12px}

/* ── A · 展厅：2×2 等权卡片 ──────────────────────────────────────── */
.grid-a{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0}
.card-a{display:flex;flex-direction:column;gap:13px;padding:19px 20px 17px;border-radius:28px;border:0;background:var(--surface-container-low);text-align:left;cursor:pointer;position:relative;overflow:hidden;min-height:0;transition:transform .24s var(--ease-standard),background .24s,box-shadow .24s}
.card-a:hover{background:var(--surface-container);box-shadow:0 5px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.card-a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.entry-head{display:flex;align-items:center;gap:13px}
.icon-tile{width:50px;height:50px;border-radius:15px;background:var(--tile);color:var(--on-tile);display:grid;place-items:center;flex:none}
.entry-titles{min-width:0}
.entry-titles h3{font-size:21px;font-weight:600;margin:0;line-height:1.2;letter-spacing:-.01em}
.entry-titles p{margin:2px 0 0;font-size:12px;color:var(--on-surface-variant)}
.chev{margin-left:auto}
.entry-preview{flex:1;min-height:96px;border-radius:18px;background:var(--surface-container-high);overflow:hidden;position:relative}
.entry-foot{display:flex;align-items:center;gap:7px;min-width:0}
.entry-foot .meta{margin-left:auto}

/* ── B · 书架：四张横向长卡 ──────────────────────────────────────── */
.shelf-list{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.shelf-card{display:grid;grid-template-columns:196px 1fr 178px 36px;gap:18px;align-items:center;padding:13px 16px 13px 13px;border-radius:24px;border:0;background:var(--surface-container-low);text-align:left;cursor:pointer;position:relative;overflow:hidden;min-height:0;flex:1;transition:background .22s,transform .22s var(--ease-standard),box-shadow .22s}
.shelf-card:hover{background:var(--surface-container);transform:translateX(3px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.shelf-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.shelf-art{height:110px;border-radius:18px;background:var(--surface-container-high);overflow:hidden}
.shelf-main{min-width:0}
.shelf-main h3{font-size:20px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
.shelf-main p{margin:0;font-size:12.5px;color:var(--on-surface-variant);line-height:1.5}
.shelf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.shelf-side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.shelf-side .meta{font-size:11px;max-width:170px}
.mini-progress{width:100%;height:5px;border-radius:999px;background:var(--surface-variant);overflow:hidden}
.mini-progress i{display:block;height:100%;border-radius:999px;background:var(--cat);width:var(--p,60%)}

/* ── C · 拼贴：非对称色块 ────────────────────────────────────────── */
.bento{display:grid;grid-template-columns:1.18fr 1.18fr .94fr;grid-template-rows:1fr 1fr;gap:17px;flex:1;min-height:0}
.card-c{border:0;border-radius:30px;padding:18px;text-align:left;cursor:pointer;position:relative;overflow:hidden;background:var(--cat-c);color:var(--cat-on);display:flex;flex-direction:column;transition:transform .24s var(--ease-standard),box-shadow .24s;min-width:0}
.card-c:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.card-c:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.b-anime{grid-column:1/3;grid-row:1}
.b-comic{grid-column:3/4;grid-row:1}
.b-novel{grid-column:1/2;grid-row:2}
.b-music{grid-column:2/4;grid-row:2}
.bento-head{display:flex;align-items:center;gap:10px;min-width:0}
.bento-head .icon-tile{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--cat-on) 13%,transparent);color:var(--cat-on)}
.bento-head h3{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
.bento-head p{margin:1px 0 0;font-size:11.5px;opacity:.76}
.bento-preview{flex:1;min-height:0;margin:14px 0 12px;border-radius:18px;background:color-mix(in srgb,var(--surface) 50%,transparent);overflow:hidden}
.bento-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;opacity:.8}
.bento-foot .chev{margin-left:auto;color:var(--cat-on);opacity:.75}
.bento .chip{border-color:color-mix(in srgb,var(--cat-on) 24%,transparent);color:var(--cat-on);background:color-mix(in srgb,var(--cat-on) 8%,transparent)}
.b-comic .bento-preview,.b-comic .bento-preview .pv-comic{height:100%}
.b-novel .bento-preview{height:132px;flex:none}
.b-music .bento-preview{height:142px;flex:none}

/* ── D · 分栏：左四入口，右侧大预览 ─────────────────────────────── */
.split{display:grid;grid-template-columns:352px 1fr;gap:22px;flex:1;min-height:0}
.list-rows{display:flex;flex-direction:column;gap:5px;padding:8px 0;justify-content:center}
.list-row{display:grid;grid-template-columns:44px 1fr 22px;gap:12px;align-items:center;padding:14px 13px;border:0;border-radius:18px;background:transparent;color:var(--on-surface);text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:background .18s}
.list-row:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.list-row.active{background:var(--secondary-container);color:var(--on-secondary-container)}
.list-row:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.list-icon{width:42px;height:42px;border-radius:13px;background:var(--cat-c);color:var(--cat-on);display:grid;place-items:center}
.list-copy h3{font-size:15.5px;margin:0;font-weight:600}
.list-copy p{margin:2px 0 0;font-size:11.5px;opacity:.72}
.list-row .chev{opacity:.5}
.detail-pane{border-radius:28px;background:var(--surface-container-low);padding:24px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.detail-art{height:266px;border-radius:22px;background:var(--surface-container-high);overflow:hidden;margin-bottom:18px}
.detail-copy .eyebrow{margin-bottom:6px}
.detail-copy h3{font-size:27px;margin:0 0 6px;font-weight:600;letter-spacing:-.015em}
.detail-copy p{margin:0;font-size:13px;line-height:1.6;color:var(--on-surface-variant)}
.detail-actions{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:18px}
.detail-actions .chip{margin-left:auto}

/* ── 模块内页 ─────────────────────────────────────────────────────── */
.module{height:100%;display:flex;flex-direction:column;overflow:hidden;animation:screenIn .3s var(--ease-emph) both}
.module-bar{display:flex;align-items:center;gap:14px;padding:16px 26px 6px;flex:none}
.module-bar .module-title{min-width:0}
.module-bar h2{font-size:23px;margin:0;font-weight:600;letter-spacing:-.01em}

.module-bar .spacer{flex:1}
.tabs{display:flex;padding:2px 26px 0;border-bottom:1px solid var(--outline-variant);flex:none}
.tab{border:0;background:transparent;color:var(--on-surface-variant);font-size:13.5px;font-weight:500;padding:12px 2px 14px;margin-right:26px;cursor:pointer;position:relative;transition:color .18s}

.module-body{flex:1;overflow:auto;padding:24px 26px 104px}
.hero{display:grid;grid-template-columns:212px 1fr;gap:24px;padding:20px;border-radius:28px;background:var(--surface-container-low);margin-bottom:26px}
.hero-art{height:150px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--cat-c),color-mix(in srgb,var(--cat) 58%,var(--surface)))}
.hero-art::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-48px;top:-58px;background:radial-gradient(circle,rgba(255,255,255,.5),transparent 66%)}
.hero-art .art-label{position:absolute;left:14px;bottom:12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cat-on);opacity:.8}
.hero-art .art-play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.88);color:#1d1b20;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hero-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero-copy h3{font-size:26px;margin:8px 0 4px;font-weight:600;letter-spacing:-.015em}
.hero-sub{margin:0;font-size:12.5px;color:var(--on-surface-variant)}
.progress{height:6px;border-radius:999px;background:var(--surface-variant);overflow:hidden;margin:15px 0 18px}
.progress span{display:block;height:100%;border-radius:999px;background:var(--primary)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-filled,.btn-tonal,.btn-text{height:44px;border:0;border-radius:999px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .18s,background .18s}
.btn-filled{background:var(--primary);color:var(--on-primary)}

.btn-text{background:transparent;color:var(--primary);padding:0 12px}
.btn-text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.section-title h3{font-size:17px;margin:0;font-weight:600}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:0 2px 10px;margin-bottom:18px}
.tile{flex:none;width:128px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit}
.tile-art{height:172px;border-radius:18px;background:linear-gradient(152deg,var(--cat-c),color-mix(in srgb,var(--cat) 52%,var(--surface)));position:relative;overflow:hidden;margin-bottom:8px;transition:transform .2s var(--ease-standard)}
.tile:hover .tile-art{transform:translateY(-2px)}
.tile-art::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-30px;bottom:-34px;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 68%)}
.tile-art::after{content:"";position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.26)}
.tile-title{font-size:12px;line-height:1.35;margin:0;color:var(--on-surface);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.fab{position:absolute;right:26px;bottom:24px;height:56px;border:0;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:9px;padding:0 20px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.16);z-index:3;overflow:hidden;transition:box-shadow .2s,transform .2s var(--ease-standard)}
.fab:hover{box-shadow:0 10px 22px rgba(0,0,0,.22);transform:translateY(-1px)}
.has-player .fab{bottom:100px}

/* B 版模块：模块内左侧导航 */
.module-rail-layout{height:100%;display:flex;overflow:hidden;animation:screenIn .3s var(--ease-emph) both}
.rail{width:208px;flex:none;background:var(--surface-container-low);display:flex;flex-direction:column;padding:14px 10px;gap:6px;border-right:1px solid var(--outline-variant)}

.rail-brand{display:flex;align-items:center;gap:10px;padding:12px 10px 18px}
.rail-brand .icon-tile{width:42px;height:42px;border-radius:13px}

.rail-nav{display:flex;flex-direction:column;gap:3px}
.rail-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--on-surface-variant);font-size:13px;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.rail-item:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.rail-item.active{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
.rail-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--outline-variant)}
.module-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pane-head{display:flex;align-items:center;gap:14px;padding:18px 26px 8px;flex:none}
.pane-head h2{font-size:20px;margin:0;font-weight:600}

/* 模块内的次级页 */

.day{background:var(--surface-container-low);border-radius:18px;padding:12px 10px;min-height:210px}
.day h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant);margin:0 0 10px;text-align:center}
.show{background:var(--surface-container-high);border-radius:10px;padding:8px;font-size:10.5px;line-height:1.35;margin-bottom:7px;color:var(--on-surface)}
.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.source-card{background:var(--surface-container-low);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.source-card h4{margin:0;font-size:15px;font-weight:600}
.source-card p{margin:0;font-size:11.5px;color:var(--on-surface-variant);line-height:1.5}
.source-card .chip{align-self:flex-start;margin-top:auto}
.source-list{display:flex;flex-direction:column;gap:8px}
.source-row{display:flex;align-items:center;gap:14px;background:var(--surface-container-low);border-radius:16px;padding:14px 16px}
.source-row .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none}
.source-row b{font-size:13px;font-weight:600}
.source-row span{font-size:11px;color:var(--on-surface-variant);margin-left:auto}
.playlist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.playlist{background:var(--surface-container-low);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.playlist-art{height:120px;border-radius:16px;background:linear-gradient(140deg,var(--cat-c),color-mix(in srgb,var(--cat) 52%,var(--surface)))}
.playlist b{font-size:13px}
.playlist span{font-size:11px;color:var(--on-surface-variant)}
.grid-fav{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* 音乐模块底部播放条 */
.mini-player{position:absolute;left:26px;right:26px;bottom:20px;height:68px;border-radius:20px;background:var(--surface-container-highest);box-shadow:0 8px 22px rgba(0,0,0,.16);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:2}
.mp-art{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,var(--cat),color-mix(in srgb,var(--cat) 34%,#000 22%));flex:none}

.mp-copy span{display:block;font-size:10.5px;color:var(--on-surface-variant);margin-top:2px}

.mp-actions{display:flex;gap:2px}

/* ── 设置侧边抽屉 ─────────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .24s var(--ease-standard);z-index:5}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:92%;background:var(--surface-container-low);border-radius:28px 0 0 28px;transform:translateX(102%);transition:transform .34s var(--ease-emph);z-index:6;display:flex;flex-direction:column;box-shadow:-12px 0 34px rgba(0,0,0,.14)}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 22px 10px}

.sheet-head .eyebrow{margin-bottom:5px}
.sheet-body{overflow:auto;padding:6px 22px 30px}
.group-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:20px 0 4px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--outline-variant)}

.switch::after{content:"";position:absolute;left:6px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:left .2s var(--ease-standard),width .2s,height .2s,background .2s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:26px;width:24px;height:24px;background:var(--on-primary)}
.seg-small{display:inline-flex;border:1px solid var(--outline);border-radius:999px;padding:2px;gap:1px;flex:none}
.seg-small button{border:0;background:transparent;color:var(--on-surface);font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer}
.seg-small button.on{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
.theme-dots{display:flex;gap:10px;align-items:center}
.theme-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);padding:0;box-shadow:0 0 0 1px var(--outline-variant)}
.theme-dot.on{border-color:var(--on-surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--on-surface) 12%,transparent)}
.module-link{display:flex;align-items:center;gap:12px;padding:12px 2px;border:0;background:transparent;border-bottom:1px solid var(--outline-variant);cursor:pointer;text-align:left;width:100%;color:inherit}
.module-link .icon-tile{width:38px;height:38px;border-radius:12px}
.module-link b{font-size:13px;font-weight:500}
.module-link span{display:block;font-size:10.5px;color:var(--on-surface-variant);margin-top:1px}
.module-link .chev{margin-left:auto}
.acc-hint{font-size:11px;line-height:1.5;color:var(--on-surface-variant);margin:0 0 6px}
.app-group{border-bottom:1px solid var(--outline-variant);margin:0 0 2px}
.app-group summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700}
.app-group summary::-webkit-details-marker{display:none}

.app-group .group-body{padding-bottom:4px}
.module-acc{background:var(--surface-container);border-radius:18px;margin:7px 0;overflow:hidden}
.module-acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer}

.module-acc summary:hover{background:color-mix(in srgb,var(--on-surface) 4%,transparent)}
.module-acc .icon-tile{width:38px;height:38px;border-radius:12px}
.acc-copy{min-width:0;display:flex;flex-direction:column}

// ═══════════════════════════════════════════════════════════════════
// 渲染
// ═══════════════════════════════════════════════════════════════════
function renderHome() {
  if (state.variant === 'b') return homeB();
  if (state.variant === 'c') return homeC();
  if (state.variant === 'd') return homeD();
  return homeA();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.media ? (state.variant === 'b' ? moduleWithRail(state.media) : moduleWithBar(state.media)) : renderHome();
  requestAnimationFrame(() => {
    app.querySelectorAll('.sheet').forEach(el => el.classList.add('open'));
    app.querySelectorAll('.scrim').forEach(el => el.classList.add('show'));
  });
  updateNotes();
}

function updateNotes() {
  const n = NOTES[state.variant];
  document.getElementById('noteMain').innerHTML = `<b>${n.name}</b> — ${n.text}`;
  document.getElementById('noteSide').textContent = SETTINGS_NOTES[state.settings];
}

function toast(msg) {
  const app = document.getElementById('app');
  const el = document.createElement('div');
  el.className = 'snackbar';
  el.textContent = msg;
  app.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 220); }, 1700);
}

// ═══════════════════════════════════════════════════════════════════
// 交互：全部走委托，重渲染后不用重绑
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('click', (e) => {
  const variantBtn = e.target.closest('[data-variant]');
  if (variantBtn) {
    state.variant = variantBtn.dataset.variant;
    state.media = null; state.tab = 0; state.sheet = null; state.focus = 'anime';
    document.querySelectorAll('[data-variant]').forEach(b => b.setAttribute('aria-selected', String(b === variantBtn)));
    render();
    return;
  }

  const modeBtn = e.target.closest('[data-settings-mode]');
  if (modeBtn) {
    state.settings = modeBtn.dataset.settingsMode;
    state.sheet = null;
    document.querySelectorAll('[data-settings-mode]').forEach(b => b.setAttribute('aria-selected', String(b === modeBtn)));
    render();
    return;
  }

  const deviceBtn = e.target.closest('[data-device]');
  if (deviceBtn) {
    const phone = deviceBtn.dataset.device === 'phone';
    document.querySelector('.window').classList.toggle('phone', phone);
    document.querySelectorAll('[data-device]').forEach(b => b.setAttribute('aria-selected', String(b === deviceBtn)));
    return;
  }

  const seed = e.target.closest('[data-seed-choice]');
  if (seed) {
    document.body.dataset.seed = seed.dataset.seedChoice;
    document.querySelectorAll('[data-seed-choice]').forEach(b => b.classList.toggle('on', b.dataset.seedChoice === seed.dataset.seedChoice));
    return;
  }

  const back = e.target.closest('[data-back]');
  if (back) { state.media = null; state.sheet = null; state.tab = 0; render(); return; }

  const open = e.target.closest('[data-open]');
  if (open) { state.media = open.dataset.open; state.tab = 0; state.sheet = null; render(); return; }

  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = Number(tab.dataset.tab); render(); return; }

  const gear = e.target.closest('[data-settings]');
  if (gear) {
    state.sheet = gear.dataset.settings;
    state.sheetKey = gear.dataset.key || state.media;
    render();
    return;
  }

  const close = e.target.closest('[data-close-sheet]');
  if (close) { state.sheet = null; render(); return; }

  const sw = e.target.closest('[data-switch]');
  if (sw) {
    const on = !sw.classList.contains('on');
    sw.classList.toggle('on', on);
    sw.setAttribute('aria-checked', String(on));
    return;
  }

  const choice = e.target.closest('[data-choice]');
  if (choice) {
    const group = choice.parentElement;
    group.querySelectorAll('[data-choice]').forEach(b => b.classList.toggle('on', b === choice));
    return;
  }

  const t = e.target.closest('[data-toast]');
  if (t) { toast(t.dataset.toast); return; }
});

// D 版：悬停换右侧预览
document.addEventListener('mouseover', (e) => {
  if (state.variant !== 'd' || state.media) return;
  const row = e.target.closest('[data-focus]');
  if (!row) return;
  const key = row.dataset.focus;
  if (key === state.focus) return;
  state.focus = key;
  document.querySelectorAll('[data-focus]').forEach(r => r.classList.toggle('active', r.dataset.focus === key));
  const pane = document.getElementById('detailPane');
  if (pane) pane.innerHTML = detailContent(key);
});

// MD3 状态层：点击水波
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-ripple]');
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const d = Math.max(rect.width, rect.height) * 1.2;
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = d + 'px';
  span.style.left = (e.clientX - rect.left - d / 2) + 'px';
  span.style.top = (e.clientY - rect.top - d / 2) + 'px';
  el.appendChild(span);
  setTimeout(() => span.remove(), 600);
});

render();
</script>
